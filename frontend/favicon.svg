<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="spBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Pulse Waveform Gradient -->
    <linearGradient id="spPulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="spGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Modern Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#spBg)" stroke="url(#spBorder)" stroke-width="1.5" />

  <!-- Heartbeat ECG Pulse Waveform -->
  <path d="M 8 35 L 20 35 L 25 43 L 34 16 L 42 47 L 48 29 L 56 29" 
        fill="none" 
        stroke="url(#spPulse)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#spGlow)" />

  <!-- Accent Pulse Beacon Dots -->
  <circle cx="34" cy="16" r="3.2" fill="#38bdf8" />
  <circle cx="48" cy="29" r="2.8" fill="#10b981" />
  <circle cx="20" cy="35" r="1.8" fill="#60a5fa" opacity="0.8" />
</svg>
