<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPulse — Sign In or Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --auth-bg: #f8fafc;
      --auth-card: #ffffff;
      --auth-border: #e2e8f0;
      --auth-accent: #2563eb;
      --auth-accent-hover: #1d4ed8;
      --auth-text: #0f172a;
      --auth-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #eff6ff 0%, #f8fafc 60%, #f1f5f9 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--auth-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background grid */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: var(--auth-muted);
      line-height: 1.4;
    }

    /* Auth Card (White Theme) */
    .auth-card {
      background: var(--auth-card);
      border: 1px solid var(--auth-border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.08),
                  0 4px 16px -2px rgba(15, 23, 42, 0.04);
    }

    /* Segmented Tab Switcher */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-tab-btn:hover {
      color: #0f172a;
    }

    .auth-tab-btn.active {
      background: var(--auth-accent);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    /* Feedback message banner */
    .auth-feedback-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-feedback-banner.error {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    .auth-feedback-banner.success {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .auth-input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      color: #0f172a;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .auth-input::placeholder {
      color: #94a3b8;
      font-size: 13.5px;
    }

    .auth-input:focus {
      outline: none;
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .input-wrapper:focus-within i.field-icon {
      color: #2563eb;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
      transition: color 0.2s;
    }

    .toggle-password-btn:hover {
      color: #334155;
    }

    /* Submit Button */
    .auth-submit-btn {
      width: 100%;
      height: 48px;
      margin-top: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
    }

    .auth-submit-btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .auth-submit-btn:active {
      transform: translateY(0);
    }

    .auth-submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Switch mode prompt */
    .auth-footer-prompt {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--auth-muted);
    }

    .auth-switch-link {
      color: #2563eb;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-left: 4px;
      font-size: 13px;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .auth-switch-link:hover {
      color: #1d4ed8;
    }

    .feature-highlights {
      margin-top: 24px;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #e2e8f0;
      padding-top: 18px;
    }

    .highlight-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .highlight-item i {
      color: #10b981;
      font-size: 13px;
    }

    /* 6-Digit OTP Inputs */
    .otp-inputs-wrapper {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 14px 0 10px 0;
    }

    .otp-digit-input {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .otp-digit-input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
      transform: translateY(-2px);
    }

    .otp-digit-input.filled {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-logo-badge">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <h1 class="brand-title">StockPulse</h1>
      <p class="brand-subtitle">Real-time dynamic stock monitoring & probabilistic alerts</p>
    </div>

    <!-- Main Auth Card -->
    <div class="auth-card">
      <!-- Tabs -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
        <button type="button" class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="auth-feedback" class="auth-feedback-banner">
        <i id="feedback-icon" class="fa-solid fa-circle-exclamation"></i>
        <span id="feedback-text">Message</span>
      </div>

      <!-- 1. SIGN IN FORM -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)" autocomplete="on">
        <div class="form-group">
          <label for="login-identifier">Email or Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user field-icon"></i>
            <input
              type="text"
              id="login-identifier"
              class="auth-input"
              placeholder="Enter your email or username"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock field-icon"></i>
            <input
              type="password"
              id="login-password"
              class="auth-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('login-password', this)" title="Show/hide password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="auth-submit-btn">
          <span>Sign In to StockPulse</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p class="auth-footer-prompt">
          Don't have an account yet?
          <button type="button" class="auth-switch-link" onclick="switchAuthTab('register')">Create an account</button>
        </p>
      </form>

      <!-- 2. CREATE ACCOUNT FORM -->
      <form id="form-register" onsubmit="handleRegisterSubmit(event)" style="display: none;" autocomplete="on">
        <div class="form-group">
          <label for="register-name">Full Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card field-icon"></i>
            <input
              type="text"
              id="register-name"
              class="auth-input"
              placeholder="Enter your name"
              required
              autocomplete="name"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="register-username">Username <span style="font-weight: 400; color: #94a3b8;">(optional)</span></label>
          <div class="input-wrapper">
            <i class="fa-solid fa-at field-icon"></i>
            <input
              type="text"
              id="register-username"
              class="auth-input"
              placeholder="Choose a username (e.g. trader_john)"
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="register-email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope field-icon"></i>
            <input
              type="email"
              id="register-email"
              class="auth-input"
              placeholder="Enter your email address"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock field-icon"></i>
            <input
              type="password"
              id="register-password"
              class="auth-input"
              placeholder="Create a strong password (min 4 characters)"
              required
              autocomplete="new-password"
            >
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('register-password', this)" title="Show/hide password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-register-submit" class="auth-submit-btn">
          <span>Create Account & Start Monitoring</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p class="auth-footer-prompt">
          Already have an account?
          <button type="button" class="auth-switch-link" onclick="switchAuthTab('login')">Sign in here</button>
        </p>
      </form>

      <!-- 3. EMAIL OTP VERIFICATION FORM -->
      <form id="form-otp" class="auth-form" style="display: none;" onsubmit="handleOtpSubmit(event)">
        <div style="text-align: center; margin-bottom: 18px;">
          <div style="width: 52px; height: 52px; border-radius: 50%; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px; border: 1px solid #bfdbfe;">
            <i class="fa-solid fa-envelope-circle-check"></i>
          </div>
          <h3 style="margin: 0 0 6px 0; color: #0f172a; font-size: 19px; font-weight: 700;">Verify Your Email</h3>
          <p style="margin: 0; color: #64748b; font-size: 13px; line-height: 1.5;">
            We sent a 6-digit verification code to<br>
            <strong id="otp-target-email" style="color: #0f172a;">user@example.com</strong>
          </p>
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label style="text-align: center; display: block; margin-bottom: 8px; font-weight: 600;">Enter 6-Digit Code</label>
          <div class="otp-inputs-wrapper">
            <input type="text" maxlength="1" class="otp-digit-input" data-idx="0" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required>
            <input type="text" maxlength="1" class="otp-digit-input" data-idx="1" inputmode="numeric" pattern="[0-9]*" required>
            <input type="text" maxlength="1" class="otp-digit-input" data-idx="2" inputmode="numeric" pattern="[0-9]*" required>
            <input type="text" maxlength="1" class="otp-digit-input" data-idx="3" inputmode="numeric" pattern="[0-9]*" required>
            <input type="text" maxlength="1" class="otp-digit-input" data-idx="4" inputmode="numeric" pattern="[0-9]*" required>
            <input type="text" maxlength="1" class="otp-digit-input" data-idx="5" inputmode="numeric" pattern="[0-9]*" required>
          </div>
        </div>

        <button type="submit" id="btn-otp-verify" class="auth-submit-btn">
          <span>Verify & Enter Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid #f1f5f9; font-size: 13px;">
          <button type="button" class="auth-switch-link" onclick="backToRegisterEdit()" style="color: #64748b; text-decoration: none;">
            <i class="fa-solid fa-arrow-left"></i> Change Email
          </button>
          <div>
            <span id="otp-countdown-text" style="color: #94a3b8; font-size: 12px;">Resend in <strong id="otp-seconds">60</strong>s</span>
            <button type="button" id="btn-resend-otp" class="auth-switch-link" style="display: none; font-weight: 700;" onclick="resendOtpCode()">Resend Code</button>
          </div>
        </div>
      </form>

      <!-- Highlights Footer -->
      <div class="feature-highlights">
        <div class="highlight-item">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Isolated Monitors</span>
        </div>
        <div class="highlight-item">
          <i class="fa-solid fa-bell"></i>
          <span>Personal Alerts</span>
        </div>
        <div class="highlight-item">
          <i class="fa-solid fa-bolt"></i>
          <span>Live 10s Updates</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // If user already has a valid token, redirect directly to /live
    (function checkExistingSession() {
      const token = localStorage.getItem('stockpulse_jwt_token');
      if (token) {
        fetch('/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + token }
        }).then(res => {
          if (res.ok) {
            window.location.replace('/live');
          } else {
            localStorage.removeItem('stockpulse_jwt_token');
            localStorage.removeItem('stockpulse_user_profile');
          }
        }).catch(() => {});
      }
    })();

    // Tab switcher
    function switchAuthTab(mode) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      hideFeedback();

      if (mode === 'register') {
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
        formLogin.style.display = 'none';
        formRegister.style.display = 'block';
        document.getElementById('register-name').focus();
      } else {
        tabRegister.classList.remove('active');
        tabLogin.classList.add('active');
        formRegister.style.display = 'none';
        formLogin.style.display = 'block';
        document.getElementById('login-identifier').focus();
      }
    }

    // Toggle password eye
    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      const icon = btnEl.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    // Banner feedback helpers
    function showFeedback(msg, isError = true) {
      const banner = document.getElementById('auth-feedback');
      const icon = document.getElementById('feedback-icon');
      const text = document.getElementById('feedback-text');
      banner.className = 'auth-feedback-banner ' + (isError ? 'error' : 'success');
      icon.className = isError ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';
      text.textContent = msg;
      banner.style.display = 'flex';
    }

    function hideFeedback() {
      const banner = document.getElementById('auth-feedback');
      banner.style.display = 'none';
    }

    // Handle Login Submit
    async function handleLoginSubmit(e) {
      e.preventDefault();
      hideFeedback();

      const identInput = document.getElementById('login-identifier');
      const passInput = document.getElementById('login-password');
      const btn = document.getElementById('btn-login-submit');

      const identifier = identInput.value.trim();
      const password = passInput.value;

      if (!identifier || !password) {
        showFeedback('Please enter both your email/username and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Signing in...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();

        if (!res.ok) {
          const detail = data && data.detail ? data.detail : 'Invalid credentials. Please try again.';
          showFeedback(detail, true);
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In to StockPulse</span> <i class="fa-solid fa-arrow-right"></i>';
          return;
        }

        // Success!
        localStorage.setItem('stockpulse_jwt_token', data.access_token);
        localStorage.setItem('stockpulse_user_profile', JSON.stringify(data.user));
        showFeedback(`Welcome back, ${data.user.name}! Redirecting...`, false);

        setTimeout(() => {
          window.location.href = '/live';
        }, 400);

      } catch (err) {
        console.error('Login error:', err);
        showFeedback('Network connection error. Please try again.', true);
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to StockPulse</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }

    // Pending registration state while waiting for OTP
    let pendingRegistration = null;
    let otpCountdownInterval = null;

    // Handle Register Submit -> Step 1: Send OTP
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      hideFeedback();

      const nameInput = document.getElementById('register-name');
      const userInput = document.getElementById('register-username');
      const emailInput = document.getElementById('register-email');
      const passInput = document.getElementById('register-password');
      const btn = document.getElementById('btn-register-submit');

      const name = nameInput.value.trim();
      const username = userInput.value.trim();
      const email = emailInput.value.trim();
      const password = passInput.value;

      if (!name || !email || !password) {
        showFeedback('Please fill in all required fields.');
        return;
      }

      if (password.length < 4) {
        showFeedback('Password must be at least 4 characters long.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Verifying email & sending code...</span>';

      try {
        const res = await fetch('/api/auth/send-registration-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name })
        });

        const data = await res.json();

        if (!res.ok) {
          const detail = data && data.detail ? data.detail : 'Email verification failed. Please try again.';
          showFeedback(detail, true);
          btn.disabled = false;
          btn.innerHTML = '<span>Create Account & Start Monitoring</span> <i class="fa-solid fa-arrow-right"></i>';
          return;
        }

        // OTP sent successfully!
        pendingRegistration = { name, username, email, password };
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account & Start Monitoring</span> <i class="fa-solid fa-arrow-right"></i>';

        // Switch to OTP Verification View
        document.getElementById('form-register').style.display = 'none';
        document.querySelector('.auth-tabs').style.display = 'none';
        document.getElementById('form-otp').style.display = 'block';
        document.getElementById('otp-target-email').textContent = email;

        showFeedback(`Verification code sent to ${email}. Please check your inbox.`, false);
        startOtpCountdown(60);
        setupOtpDigitInputs();
      } catch (err) {
        console.error('OTP Send error:', err);
        showFeedback('Network error. Unable to verify email.', true);
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account & Start Monitoring</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }

    // Setup interactive 6-digit OTP boxes
    function setupOtpDigitInputs() {
      const inputs = document.querySelectorAll('.otp-digit-input');
      inputs.forEach((input, index) => {
        input.value = '';
        input.classList.remove('filled');

        input.oninput = (e) => {
          const val = e.target.value.replace(/\D/g, '');
          e.target.value = val ? val[val.length - 1] : '';
          e.target.classList.toggle('filled', !!e.target.value);

          if (e.target.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          // Check if all 6 digits entered
          const fullCode = Array.from(inputs).map(i => i.value).join('');
          if (fullCode.length === 6) {
            handleOtpSubmit();
          }
        };

        input.onkeydown = (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        };

        input.onpaste = (e) => {
          e.preventDefault();
          const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/\D/g, '');
          if (pastedData) {
            fillOtpInputs(pastedData.slice(0, 6));
            if (pastedData.length >= 6) {
              handleOtpSubmit();
            }
          }
        };
      });

      if (inputs[0]) inputs[0].focus();
    }

    function fillOtpInputs(codeStr) {
      const inputs = document.querySelectorAll('.otp-digit-input');
      for (let i = 0; i < inputs.length; i++) {
        inputs[i].value = codeStr[i] || '';
        inputs[i].classList.toggle('filled', !!inputs[i].value);
      }
      const lastIdx = Math.min(codeStr.length, inputs.length) - 1;
      if (lastIdx >= 0 && inputs[lastIdx]) inputs[lastIdx].focus();
    }

    // Handle OTP Verify Submit -> Step 2: Finalize Account
    async function handleOtpSubmit(e) {
      if (e) e.preventDefault();
      hideFeedback();

      if (!pendingRegistration) {
        showFeedback('Registration session expired. Please start over.');
        backToRegisterEdit();
        return;
      }

      const inputs = document.querySelectorAll('.otp-digit-input');
      const otpCode = Array.from(inputs).map(i => i.value).join('');

      if (otpCode.length !== 6) {
        showFeedback('Please enter the complete 6-digit verification code.');
        return;
      }

      const btn = document.getElementById('btn-otp-verify');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Verifying code...</span>';

      try {
        const res = await fetch('/api/auth/verify-registration-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: pendingRegistration.email,
            otp: otpCode,
            name: pendingRegistration.name,
            password: pendingRegistration.password,
            username: pendingRegistration.username || null
          })
        });

        const data = await res.json();

        if (!res.ok) {
          const detail = data && data.detail ? data.detail : 'Verification failed. Please check the code.';
          showFeedback(detail, true);
          btn.disabled = false;
          btn.innerHTML = '<span>Verify & Enter Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
          return;
        }

        // Verified!
        clearInterval(otpCountdownInterval);
        localStorage.setItem('stockpulse_jwt_token', data.access_token);
        localStorage.setItem('stockpulse_user_profile', JSON.stringify(data.user));
        showFeedback(`Email verified! Welcome, ${data.user.name}! Entering dashboard...`, false);

        setTimeout(() => {
          window.location.href = '/live';
        }, 500);

      } catch (err) {
        console.error('OTP Verification error:', err);
        showFeedback('Network error during verification. Please try again.', true);
        btn.disabled = false;
        btn.innerHTML = '<span>Verify & Enter Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }

    // Resend OTP code
    async function resendOtpCode() {
      if (!pendingRegistration) return;
      hideFeedback();
      const btnResend = document.getElementById('btn-resend-otp');
      btnResend.disabled = true;
      btnResend.textContent = 'Sending...';

      try {
        const res = await fetch('/api/auth/resend-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: pendingRegistration.email,
            name: pendingRegistration.name
          })
        });

        const data = await res.json();
        if (!res.ok) {
          showFeedback(data.detail || 'Could not resend code. Please wait.', true);
          btnResend.disabled = false;
          btnResend.textContent = 'Resend Code';
          return;
        }

        showFeedback(`New code sent to ${pendingRegistration.email}!`, false);
        startOtpCountdown(60);
        setupOtpDigitInputs();

      } catch (err) {
        showFeedback('Network error. Failed to resend code.', true);
        btnResend.disabled = false;
        btnResend.textContent = 'Resend Code';
      }
    }

    // Countdown timer for OTP
    function startOtpCountdown(seconds = 60) {
      clearInterval(otpCountdownInterval);
      const textEl = document.getElementById('otp-countdown-text');
      const secondsEl = document.getElementById('otp-seconds');
      const btnResend = document.getElementById('btn-resend-otp');

      btnResend.style.display = 'none';
      btnResend.disabled = false;
      btnResend.textContent = 'Resend Code';
      textEl.style.display = 'inline';
      secondsEl.textContent = seconds;

      let remaining = seconds;
      otpCountdownInterval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(otpCountdownInterval);
          textEl.style.display = 'none';
          btnResend.style.display = 'inline';
        } else {
          secondsEl.textContent = remaining;
        }
      }, 1000);
    }

    // Back to edit email
    function backToRegisterEdit() {
      clearInterval(otpCountdownInterval);
      hideFeedback();
      document.getElementById('form-otp').style.display = 'none';
      document.querySelector('.auth-tabs').style.display = 'flex';
      document.getElementById('form-register').style.display = 'block';
      document.getElementById('register-email').focus();
    }
  </script>
</body>
</html>
